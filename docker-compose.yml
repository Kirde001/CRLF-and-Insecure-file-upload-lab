version: '3.8'

services:
  apache-vuln:
    image: php:5.6-apache
    container_name: waf_apache_module
    ports:
      - "192.168.10.10:8081:80"
    volumes:
      - ./apache-module/src:/var/www/html
    command: bash -c "chmod 777 /var/www/html/uploads && apache2-foreground"
    restart: always
    
  python-api:
    build: ./python-module
    container_name: waf_python_api
    ports:
      - "8082:5000"
    restart: always